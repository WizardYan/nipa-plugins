schema: nipa.plugin/v3
plugin:
  id: mrtrix3
  name: MRtrix3
  version: 0.3.2
  category: Diffusion MRI
  description: Fit a diffusion tensor and derive FA, MD, AD, and RD maps from a diffusion MRI scan.
upstream:
  - name: MRtrix3
    version: 3.0.8
    runtime_requirement: mrtrix3-3.0.8
    homepage: https://www.mrtrix.org/
    repository: https://github.com/MRtrix3/mrtrix3
    license: MPL-2.0
    redistribution: {mode: reference_only, permitted: false}
transformation:
  inputs:
    dwi:
      type: imaging.mri.diffusion.dwi
      source: artifact
      cardinality: one
      label: Diffusion MRI with matching bvec and bval files
    parcellation:
      type: imaging.mri.anatomical.segmentation
      required: false
      label: Integer brain parcellation aligned to the DWI grid
      constraints:
        same_grid_as: dwi
        required_when: {connectome: true, parcellation_source: aligned}
    reconstruction:
      type: imaging.mri.anatomical.reconstruction
      required: false
      label: FreeSurfer reconstruction for the selected DWI
      attributes: {method: freesurfer, representation: anatomical_reconstruction}
      constraints:
        required_when: {connectome: true, parcellation_source: freesurfer}
  parameters:
    tractography:
      type: boolean
      default: false
      description: Estimate a white matter FOD and run whole-brain iFOD2 tractography after tensor fitting.
      control:
        type: checkbox
      set_when:
        parameter: connectome
        equals: true
        value: true
      enabled_when:
        parameter: connectome
        equals: false
      label: Tractography
    connectome:
      type: boolean
      default: false
      description: Enables tractography and builds a streamline-count matrix from the selected parcellation
        source.
      control:
        type: checkbox
      label: Connectome
    parcellation_source:
      type: enum
      default: aligned
      description: Choose an existing DWI-aligned label image or prepare one from a FreeSurfer reconstruction.
      values:
        aligned: Existing aligned parcellation
        freesurfer: FreeSurfer reconstruction
      enabled_when:
        parameter: connectome
        equals: true
      option_labels:
        aligned: Existing aligned parcellation
        freesurfer: FreeSurfer reconstruction
      label: Parcellation source
  outputs:
    fa:
      type: imaging.mri.diffusion.scalar_map
      attributes: {metric: FA, model: DTI}
      files: {patterns: ['*_FA.nii.gz'], label: Fractional anisotropy}
    md:
      type: imaging.mri.diffusion.scalar_map
      attributes: {metric: MD, model: DTI}
      files: {patterns: ['*_MD.nii.gz'], label: Mean diffusivity}
    ad:
      type: imaging.mri.diffusion.scalar_map
      attributes: {metric: AD, model: DTI}
      files: {patterns: ['*_AD.nii.gz'], label: Axial diffusivity}
    rd:
      type: imaging.mri.diffusion.scalar_map
      attributes: {metric: RD, model: DTI}
      files: {patterns: ['*_RD.nii.gz'], label: Radial diffusivity}
    fod:
      type: imaging.mri.diffusion.orientation
      attributes: {representation: orientation_distribution, model: CSD}
      when: {tractography: true}
      files: {patterns: ['*_wmfod.mif']}
    tractogram:
      type: imaging.mri.diffusion.tractography
      attributes: {representation: tractogram, algorithm: iFOD2}
      when: {tractography: true}
      files: {patterns: ['*_tracks.tck']}
    matrix:
      type: imaging.mri.diffusion.connectivity
      attributes: {representation: matrix, weight: streamline_count}
      when: {connectome: true}
      files: {patterns: ['*_connectome.csv']}
    assignments:
      type: table.statistics
      when: {connectome: true}
      files: {patterns: ['*_assignments.txt']}
    prepared_parcellation:
      type: imaging.mri.anatomical.segmentation
      attributes: {space: dwi, method: freesurfer}
      when: {connectome: true, parcellation_source: freesurfer}
      files: {patterns: ['*_nodes_dwi.nii.gz']}
    parcellation_registration:
      type: transform
      attributes: {from_space: T1w, to_space: dwi, transform_type: affine}
      when: {connectome: true, parcellation_source: freesurfer}
      files: {patterns: ['*_freesurfer_to_dwi.mat']}
    node_lookup:
      type: text
      when: {connectome: true, parcellation_source: freesurfer}
      files: {patterns: ['*_node_labels.txt']}
  capability:
    title: Diffusion tensor fitting
    native_engine: mrtrix3
implementation:
  entrypoint: run.sh
  resources:
    cpus: 4
    memory_gb: 16
    time: '04:00:00'
    when_any_enabled:
      parameters: [tractography, connectome]
      cpus: 8
      memory_gb: 32
      time: '08:00:00'
  runtime:
    requirements:
      - id: mrtrix3-3.0.8
        kind: container
        version: 3.0.8
        acquisition: managed
        binding_env: MRTRIX3_SIF
        discovery:
          filename_patterns: ['*mrtrix3*3.0.8*.sif']
        runtimes: [singularity, apptainer]
        sources:
          - uri: docker://mrtrix3/mrtrix3@sha256:a06f1463923d1bb748c5bba09ca1daaf2266802a84e161ba4b28238396afe82a
            digest: sha256:a06f1463923d1bb748c5bba09ca1daaf2266802a84e161ba4b28238396afe82a
            official: true
  outputs:
    root: derivatives/mrtrix3
ui:
  modalities: [dwi]
