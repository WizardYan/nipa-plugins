schema: nipa.plugin/v3
plugin:
  id: thalamic_nuclei
  name: Thalamic Nuclei Segmentation
  version: 1.1.3
  category: structural
  description: FreeSurfer thalamic nuclei segmentation as an independent Artifact
    producer.
transformation:
  inputs:
    reconstruction:
      type: imaging.mri.anatomical.reconstruction
      source: artifact
      cardinality: one
      label: FreeSurfer anatomical reconstruction
      attributes:
        representation: anatomical_reconstruction
        method: freesurfer
  outputs:
    segmentation:
      type: imaging.mri.anatomical.segmentation
      attributes:
        segmentation_type: structure
        structure: thalamic_nuclei
        method: freesurfer
  capability:
    title: Thalamic nuclei segmentation
    goal: Generate thalamic nuclei segmentation from a FreeSurfer anatomical reconstruction
implementation:
  entrypoint: run.sh
  enabled: true
  resources:
    cpus: 1
    memory_gb: 8
    time: 04:00:00
    gpu_count: 0
    scratch_gb: 8
  runtime:
    requirements:
    - id: freesurfer-7.3.2
      kind: container
      version: 7.3.2
      acquisition: site_provided
      binding_env: FREESURFER_SIF
      discovery:
        filename_patterns:
        - '*freesurfer*7.3.2*.sif'
        - '*freesurfer*.sif'
      runtimes:
      - apptainer
      - singularity
      capabilities:
      - freesurfer.core
      - freesurfer.tracula
      - freesurfer.recon_all
    licenses:
    - id: freesurfer
      required: true
      env: FS_LICENSE
      target: /opt/freesurfer/license.txt
  outputs:
    root: derivatives/thalamic_nuclei
    environment: THALAMIC_NUCLEI_OUT_ROOT
    scanner: adapter.py:scan_outputs
    artifact_adapter: adapter.py:discover_artifacts
  provenance:
    capture:
    - resolved_inputs
    - parameters
    - runtime_requirements
    - resource_request
    - execution_identity
    portable_spec: true
